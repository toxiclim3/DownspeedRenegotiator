# Default configuration template.
# Copied to config.ini on first run if config.ini is missing; edit config.ini for your router.
host=192.168.1.1
port=22
user=admin
key_file=ssh\id_ed25519
known_hosts=ssh\known_hosts
wan_port=0
target_speed_mbps=1000
poll_seconds=300
auto_renegotiate=true
notify_on_downswitch=true
notify_on_renegotiate_success=true
notify_on_renegotiate_below_target=true
notify_on_renegotiate_error=true
notify_on_settings_error=true
cooldown_seconds=120
max_auto_retries=3
